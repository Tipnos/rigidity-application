[package]
name = "rigidity-application"
version = "0.1.0"
authors = ["He-aD <ge.tristan@gmail.com>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = { version = "0.8", features = ["ws", "macros"] }
axum-extra = { version = "0.10", features = ["cookie-private"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
reqwest = { version = "0.12", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
derive_more = "0.99"
clap = { version = "4", features = ["derive", "env"] }
rust-argon2="0.8"
serde = "1.0"
serde_derive = "1.0"
serde_json = "1.0"
sparkpost="0.5"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-native-tls", "postgres", "macros", "chrono", "uuid"] }
uuid = { version = "1", features = ["serde", "v4"] }
time = "0.3.17"
rand="0.8.1"
rusoto_core = "0.48.0"
rusoto_gamelift="0.48.0"